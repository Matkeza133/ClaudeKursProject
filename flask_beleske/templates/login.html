{% extends "base.html" %}

{% block naslov %}Prijava{% endblock %}

{% block sadrzaj %}
    <div class="auth-omot">
        <span class="auth-znak">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </span>
        <h1>Prijava</h1>
        <p class="auth-podnaslov">Prijavite se da vidite svoje beleske</p>

        <div class="auth-karta">
            <form method="post" class="forma-naloga">
                <input type="text" name="korisnicko_ime" placeholder="Korisnicko ime" required autofocus>
                <input type="password" name="lozinka" placeholder="Lozinka" required>
                <button type="submit">Prijavi se</button>
            </form>
        </div>

        <p class="auth-prekid">Nemas nalog? <a href="{{ url_for('register') }}">Registruj se</a></p>
    </div>
{% endblock %}
